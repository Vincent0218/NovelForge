[project]
name = "novelforge"
version = "0.1.0"
description = "繁體小說智慧爬蟲與電子書生成工具：支援 Cloudflare 防護突破、Web Font 字體解密、深度廣告清洗與 EPUB/TXT 雙格式輸出"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.7.0",
    "ebooklib>=0.20",
    "fonttools>=4.63.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "tqdm>=4.70.0",
]
